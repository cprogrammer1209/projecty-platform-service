spring:
  application:
    name: platform-service
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: localhost
    port: 1025
  data:
    redis:
      host: localhost
      port: 6379
      # Redis is an optimisation, so a slow or missing server must not hold requests up.
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # Fail fast when the broker is down: the relay holds a database transaction while it publishes.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

# Redis is allowed to be down (the app falls back to the database), so it must not turn /actuator/health red.
management:
  health:
    redis:
      enabled: false

server:
  port: 8081

projecty:
  frontend-url: http://localhost:4200
  cors:
    allowed-origins: http://localhost:4200, http://localhost:4300
  refresh-cookie:
    secure: false # true outside local development (requires HTTPS)
  mail:
    from: "ProjectY <no-reply@projecty.local>"
  token:
    issuer: http://localhost:8081
    audience: projecty-api
    admin-audience: projecty-admin
    access-token-ttl: 15m
  session:
    idle-timeout: 7d
    absolute-timeout: 30d
  account:
    verify-email-token-ttl: 24h
    reset-password-token-ttl: 1h
    lockout-max-attempts: 5
    lockout-window: 15m
    lockout-duration: 15m
  member:
    max-portals-per-user: 20
    invitation-ttl: 7d
  admin:
    idle-timeout: 1h
    absolute-timeout: 12h
    refresh-cookie-secure: false # true outside local development (requires HTTPS)
    lockout-max-attempts: 5
    lockout-window: 15m
    lockout-duration: 15m
    # First platform admin, created at startup when none exists. Local development values only:
    # set PROJECTY_ADMIN_BOOTSTRAP_EMAIL / _PASSWORD elsewhere.
    bootstrap:
      email: admin@projecty.local
      password: projecty-admin-dev
      full-name: Platform Admin
  impersonation:
    code-ttl: 2m
  outbox:
    poll-interval: 1s
    batch-size: 100
    relay-enabled: true
    retention: 7d
    purge-interval: 1h
  # Per client IP and endpoint group (see RateLimitConstants). The per-account lockout under account/admin stays.
  rate-limit:
    enabled: true
    limits:
      login: { limit: 10, window: 1m }
      refresh: { limit: 60, window: 1m }
      signup: { limit: 10, window: 1h }
      email: { limit: 5, window: 15m }
      token: { limit: 20, window: 15m }
  redis:
    type: redis # "memory" keeps everything in this process (used by the tests)
    access-ttl: 60s # safety net for the membership cache; changes also evict it at once
    response-ttl: 60s # cached API responses and lookups; a change moves their version key, this is the safety net
    backoff: 10s # after a failed call Redis is left alone this long, so an outage costs one timeout, not one per call
  broker:
    type: kafka # "logging" only logs events (used by the tests)
    send-timeout: 5s
    partitions: 3
    # One topic per aggregate type (projecty.<aggregate>). A new aggregate must add its topic here.
    topics:
      - projecty.portal
      - projecty.member
      - projecty.invitation
